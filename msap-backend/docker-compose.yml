services:
  db:
    image: postgres:17-alpine
    container_name: msap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MSAP_DB_NAME:-msap_db}
      POSTGRES_USER: ${MSAP_DB_USER:-msap_user}
      POSTGRES_PASSWORD: ${MSAP_DB_PASSWORD:?Define MSAP_DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - msap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  msap_postgres_data:
