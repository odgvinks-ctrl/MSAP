name: msap-messagerie

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD:?Définir SYNAPSE_DB_PASSWORD dans le fichier .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20

  synapse:
    image: matrixdotorg/synapse:v1.163.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/config/demarrer.sh"]
    volumes:
      - ./synapse:/config:ro
      - synapse_data:/data
    ports:
      - "127.0.0.1:8008:8008"

  element:
    image: vectorim/element-web:v1.12.31
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ./element/config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db_data:
  synapse_data:
